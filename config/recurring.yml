# Solid Queue — tâches récurrentes.
# Format : <name>: { class: JobName, schedule: "..." }
# Schedule = expression cron classique. Configurable par environnement.

production:
  balance_reminder:
    class: BalanceReminderJob
    schedule: "every day at 8am"
  purge_old_data:
    class: PurgeOldDataJob
    schedule: "every month on the 1st at 4am"

development: {}
test: {}

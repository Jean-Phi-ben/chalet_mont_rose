# Traductions propres à l'application (rails-i18n fournit le socle : messages de
# validation, noms de mois, etc.). Formats de dates/heures utilisés par `l(...)`.
fr:
  date:
    formats:
      default: "%d/%m/%Y"
      short: "%-d %b"
      long: "%-d %B %Y"
      full: "%A %-d %B %Y"
  time:
    formats:
      default: "%-d %B %Y à %H:%M"
      short: "%-d %b %H:%M"
      long: "%-d %B %Y à %H:%M"
  activerecord:
    models:
      booking: "Réservation"
      invoice: "Facture"
      contract: "Contrat"
      client: "Client"
      user: "Compte"
      document: "Document"
      note: "Note"
      weekly_rate: "Tarif hebdomadaire"
      booking_setting: "Paramètres"
      tourist_tax_period: "Période de taxe de séjour"
    attributes:
      booking:
        check_in: "Date d'arrivée"
        check_out: "Date de départ"
        first_name: "Prénom"
        last_name: "Nom"
        email: "Email"
        phone: "Téléphone"
        guests_count: "Nombre de voyageurs"
        message: "Message"
        address: "Adresse"
        accommodation_euros: "Prix d'hébergement"
        cleaning_fee_euros: "Frais de ménage"
        deposit_euros: "Arrhes"
        terms_accepted: "Conditions générales"
      invoice:
        amount_cents: "Montant"
        received_on: "Date du paiement"
        issued_on: "Date d'émission"
        number: "Numéro"
        kind: "Type"
      user:
        email_address: "Adresse email"
        password: "Mot de passe"
        password_confirmation: "Confirmation du mot de passe"
      document:
        title: "Titre"
        kind: "Catégorie"
        file: "Fichier"
      note:
        title: "Titre"
      weekly_rate:
        week_start: "Semaine du"
        price_cents: "Prix"
      booking_setting:
        cleaning_fee_cents: "Frais de ménage"
        tourist_tax_per_person_per_night_cents: "Taxe de séjour"
        vat_rate_percent: "Taux de TVA"
